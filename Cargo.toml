[workspace]
members = [
  "crates/brgr-cli",
  "crates/brgr-core",
  "crates/brgr-platform",
  "crates/brgr-protocol",
  "crates/brgr-registry",
  "crates/brgr-runner",
  "crates/brgr-store",
]
resolver = "3"

[workspace.package]
version = "2.16.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/sorrellabs/brgr"
homepage = "https://github.com/sorrellabs/brgr"

[workspace.dependencies]
# Internal crates. crates.io needs a version beside each path.
brgr-core = { path = "crates/brgr-core", version = "2.16.0" }
brgr-platform = { path = "crates/brgr-platform", version = "2.16.0" }
brgr-protocol = { path = "crates/brgr-protocol", version = "2.16.0" }
brgr-registry = { path = "crates/brgr-registry", version = "2.16.0" }
brgr-runner = { path = "crates/brgr-runner", version = "2.16.0" }
brgr-store = { path = "crates/brgr-store", version = "2.16.0" }
anyhow = "1.0"
assert_cmd = "2.2.2"
clap = { version = "4.6.6", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false }
libc = "0.2"
predicates = "3.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "1.1"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Power",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
